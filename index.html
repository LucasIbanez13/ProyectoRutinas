<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rutinas Gym</title>
<style>
:root{
  --bg:#F3F5F9;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--line-2:#CBD5E1;
  --head:#0F172A;--head-ink:#F8FAFC;--ok:#16A34A;--ok-bg:#DCFCE7;--basic:#FEF3C7;--basic-ink:#92400E;
  --danger:#DC2626;--soft:#EEF2F7;--acc:#2563EB;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020;--card:#151B2E;--text:#E5E7EB;--muted:#94A3B8;--line:#232B45;--line-2:#334155;
    --head:#070B17;--head-ink:#F8FAFC;--ok:#22C55E;--ok-bg:#0F2E1B;--basic:#3A2E0B;--basic-ink:#FCD34D;
    --danger:#F87171;--soft:#1C2440;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020;--card:#151B2E;--text:#E5E7EB;--muted:#94A3B8;--line:#232B45;--line-2:#334155;
  --head:#070B17;--head-ink:#F8FAFC;--ok:#22C55E;--ok-bg:#0F2E1B;--basic:#3A2E0B;--basic-ink:#FCD34D;
  --danger:#F87171;--soft:#1C2440;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* cabecera con personas */
.head{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-ink);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.people{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;max-width:640px;margin:0 auto}
.people::-webkit-scrollbar{display:none}
.pp{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:rgba(255,255,255,.08);color:inherit;padding:5px 14px 5px 5px;font-weight:600;font-size:15px;position:relative}
.pp i{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.pp.on{background:#fff;color:#0F172A}
.pp.add{padding:5px 14px;font-size:20px;line-height:30px;opacity:.8}
.pp .busy{position:absolute;top:2px;left:26px;width:10px;height:10px;border-radius:50%;background:#F59E0B;border:2px solid var(--head)}

main{padding:14px 0 calc(170px + env(safe-area-inset-bottom))}

/* días */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:104px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.day b{font-size:15px}
.day small{color:var(--muted);font-size:12px}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day.on small{color:rgba(255,255,255,.85)}
.day.full small{color:var(--ok)}
.day.on.full small{color:#fff}

.hero{background:var(--head);color:var(--head-ink);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--acc);opacity:.35}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:relative;z-index:1}
.hero small{opacity:.75;font-size:13px}
.hero h2{margin:2px 0 0;font-size:24px;line-height:1.15}
.wk{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:12px;flex:none}
.wk button{background:none;border:0;color:inherit;width:38px;height:40px;font-size:22px}
.wk span{font-weight:700;font-size:14px;min-width:46px;text-align:center}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;background:var(--acc);color:#fff;padding:3px 10px;border-radius:99px;position:relative;z-index:1}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:1;font-size:13px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

.tick{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);color:transparent;font-size:20px;font-weight:800;display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.sm{width:42px;height:42px;border-radius:12px}

/* entrada en calor */
.gen .ch{display:flex;gap:12px;align-items:center}
.gen .ch b{display:block;font-size:17px}
.gen .ch small{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.seg.sm button{padding:7px 12px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--acc);color:#fff;padding:12px 16px;font-weight:700;font-size:15px;min-height:46px}
.btn.wide{width:100%;margin-top:12px}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}
.cdrow{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--soft);border-radius:12px;padding:8px 8px 8px 14px}
.big{font:800 30px/1 ui-monospace,SFMono-Regular,Consolas,monospace;flex:1}
.gen.done-c{padding:10px 14px}
.gen.done-c .ch small{color:var(--ok)}

/* ejercicios */
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:72px;overflow:hidden}
.ex.basic{border-left:5px solid #F59E0B}
.ex.open{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--shadow)}
.ex.basic.open{border-left-color:#F59E0B}
.exh{display:flex;align-items:center;gap:12px;padding:12px}
.exname{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0;display:flex;flex-direction:column;gap:3px}
.exname b{font-size:16px;line-height:1.25}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meta em{font-style:normal;font-size:11px;font-weight:700;background:var(--basic);color:var(--basic-ink);padding:2px 7px;border-radius:99px}
.meta em.f{background:var(--acc);color:#fff}
.sum{font-size:13px;font-weight:600;color:var(--ok)}
.ex.done{opacity:.7}
.ex.done .exname b{text-decoration:line-through}
.chev{flex:none;color:var(--muted);font-size:18px;transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.dots{display:flex;gap:4px;margin-top:2px}
.dots i{width:16px;height:5px;border-radius:99px;background:var(--line-2)}
.dots i.on{background:var(--ok)}
.exb{padding:0 12px 14px}
.last{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-bottom:10px}
.last .up{display:block;color:var(--ok);font-weight:700;margin-top:3px}
.note{font-size:13px;color:var(--basic-ink);background:var(--basic);border-radius:10px;padding:8px 10px;margin-bottom:10px}

details.warm{border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.warm summary{list-style:none;padding:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary small{font-weight:600;color:var(--muted);background:var(--soft);padding:2px 9px;border-radius:99px}
details.warm[open] summary{border-bottom:1px solid var(--line)}
.wl{padding:6px 12px 10px}
.wl h4{margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.wl label{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
.wl input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.wl label.ok span{text-decoration:line-through;color:var(--muted)}
details.warm{border:1px dashed var(--line-2);background:transparent}
details.warm summary{padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted)}
details.warm summary em{font-style:normal;font-weight:500;font-size:12px;opacity:.8}
details.warm[open] summary{color:var(--text)}
details.nt{margin-top:10px}
details.nt summary{list-style:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 0}
details.nt summary::-webkit-details-marker{display:none}
details.nt textarea{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:10px;background:var(--card);font-size:15px;resize:vertical}
.skip{display:block;margin:6px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
.ex.skipped .exname b{text-decoration:line-through}
.ex.skipped .sum{color:var(--muted)}
.share{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.share .btn{flex:1 1 calc(50% - 4px)}
pre.msg{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:12px;padding:12px;margin:8px 0 0;max-height:320px;overflow:auto}
.hw .nn{display:block;color:var(--muted);font-size:12px;font-style:italic}

.sets-h,.set{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;align-items:center}
.sets-h{font-size:12px;color:var(--muted);font-weight:600;padding:0 0 4px;text-align:center}
.set{padding:6px 0;border-top:1px solid var(--line)}
.set .sn{font-weight:800;text-align:center;color:var(--muted)}
.set.ok .sn{color:var(--ok)}
.set.ok .stp{background:var(--ok-bg);border-color:transparent}
.stp{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--card);height:44px}
.stp button{width:34px;height:100%;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--acc);flex:none}
.stp input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-size:17px;font-weight:700;height:100%;padding:0}
.stp input::placeholder{color:var(--muted);font-weight:500;opacity:.7}
.stp input:focus{outline:none}
.stp:focus-within{border-color:var(--acc)}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.swbox{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:6px 6px 6px 14px}
.clock{font:800 24px/1 ui-monospace,SFMono-Regular,Consolas,monospace;flex:1}
.swbox small{display:block;font:600 11px system-ui;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

.done-card{text-align:center;padding:20px 14px;background:var(--ok-bg);border-color:transparent}
.done-card b{display:block;font-size:20px;margin-bottom:4px}

/* temporizadores flotantes */
.timers{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;pointer-events:none}
.timers .wrap{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.tm{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;background:var(--head);color:var(--head-ink);border-radius:16px;padding:8px 8px 8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tm.fin{background:var(--ok)}
.tm .who{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:#fff;font-weight:800}
.tm .tl{flex:1;min-width:0;font-size:12px}
.tm .tl small{opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .tl b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .tt{font:800 24px/1 ui-monospace,SFMono-Regular,Consolas,monospace}
.tm .ab{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:10px;height:36px;min-width:38px;font-weight:700;font-size:13px}
.tm .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--c)}
.timers .compact{gap:4px}
.compact .tm{padding:4px 6px;border-radius:12px;gap:6px}
.compact .tm .who{width:28px;height:28px;font-size:13px}
.compact .tm .tt{font-size:19px}
.compact .tm .ab{height:30px;min-width:32px;font-size:12px}
.compact .tm .tl b{font-size:12px}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap{display:flex;padding:0}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;height:64px;justify-content:center;color:var(--muted);font-size:11px;font-weight:600}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:var(--acc)}

/* historial */
.hday{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px;font-weight:700}
.hex{padding:12px 14px}
.hex b{display:block;font-size:15px}
.hw{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px dashed var(--line)}
.hw:first-of-type{border-top:0}
.hw span:first-child{color:var(--muted);flex:none}
.hw.cur span:first-child{color:var(--acc);font-weight:700}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

/* ajustes */
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);flex:none}
.prow input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;background:var(--card)}
.prow .x{border:0;background:var(--soft);border-radius:10px;width:40px;height:40px;color:var(--danger);font-size:18px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.opt:first-of-type{border-top:0}
.opt input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
.opt input[type=number]{width:70px;border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--card);text-align:center}
textarea.rt{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:10px;background:var(--soft);font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pv{margin-top:10px;font-size:14px}
.pv .d{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.pv .d b{display:block;background:var(--head);color:var(--head-ink);padding:7px 12px}
.pv .d div{padding:6px 12px;border-top:1px solid var(--line)}
.pv .d div.basic{border-left:4px solid #F59E0B}
.notes{padding-left:18px;margin:6px 0 0}
.notes li{margin:0 0 10px;font-size:14px}

/* hoja modal y aviso */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:15px}
.sheet .fld,.card .fld{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sheet .fld i{width:36px;height:36px;border-radius:50%;background:var(--c);flex:none}
.sheet .fld input,.card .fld input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--card);font-size:16px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:60;background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="head"><div class="people" id="people"></div></header>
<main class="wrap" id="app"></main>
<div class="timers"><div class="wrap" id="timers"></div></div>
<nav class="tabbar"><div class="wrap">
  <button data-a="tab" data-v="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Entrenar</button>
  <button data-a="tab" data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Historial</button>
  <button data-a="tab" data-v="rutina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Rutina</button>
  <button data-a="tab" data-v="cfg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Personas</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div id="sheet"></div>

<script>
const DEFAULT_TEXT = `RUTINA DE GIMNASIO · TORSO / PIERNA (4 DÍAS)
Frecuencia 2 · Progresión Lineal · Básicos Pesados (~70%) + Accesorios (~30%) · 50-60 min por sesión
DÍA 1 – TORSO A (Foco Empuje Horizontal / Jalón Horizontal)
Press de banca plano con barra | Básico | 3 × 6-8 | 2.5 - 3 min
Remo con barra (o Pendlay) | Básico | 3 × 6-8 | 2.5 - 3 min
Press militar con mancuernas sentado | Accesorio | 3 × 8-10 | 90 seg
Extensión de tríceps en polea (cuerda) | Accesorio | 2 × 10-12 | 60 - 90 seg
DÍA 2 – PIERNA A (Foco Sentadilla)
Sentadilla libre con barra * | Básico | 3 × 6-8 | 3 min
Peso muerto rumano con barra | Básico | 3 × 6-8 | 2.5 - 3 min
Prensa de piernas | Accesorio | 3 × 10-12 | 90 seg
Elevación de pantorrillas (de pie o sentado) | Accesorio | 3 × 12-15 | 60 seg
DÍA 4 – TORSO B (Foco Jalón Vertical / Empuje Inclinado)
Dominadas (o Jalón al pecho pesado en polea) | Básico | 3 × 6-8 | 2.5 - 3 min
Press inclinado con barra o mancuernas | Básico | 3 × 6-8 | 2.5 - 3 min
Elevaciones laterales con mancuernas | Accesorio | 3 × 12-15 | 60 - 90 seg
Curl de bíceps con barra Z o mancuernas | Accesorio | 2 × 8-10 | 60 - 90 seg
DÍA 5 – PIERNA B (Foco Peso Muerto)
Peso muerto convencional (o barra hexagonal) | Básico | 3 × 5-6 | 3 min
Sentadilla búlgara con mancuernas (o Hack Squat) | Básico | 3 × 8-10 c/u | 2 min
Face pull en polea (salud postural) | Accesorio | 3 × 12-15 | 60 - 90 seg
Plancha abdominal (con disco cuando sea fácil) | Accesorio | 3 × 30-45 seg | 60 seg
* Nota Sentadilla: Si en las primeras 1-2 semanas necesitan afianzar el movimiento, pueden arrancar con Sentadilla Goblet con mancuerna y pasar a Sentadilla libre con barra en la semana 2 o 3. Días 3, 6 y 7 son de descanso activo (caminata) y recuperación.
Calentamiento previo: 5 a 10 minutos de caminata o bici suave + 1 o 2 series de aproximación livianas del primer ejercicio antes de poner el peso efectivo.
Semanas 1 a 4 (Progresión lineal): Usen un peso que les permita hacer 6 repeticiones dejando 2 repeticiones en reserva (RIR 2, sin llegar al fallo). Cada sesión intenten sumar repeticiones (3×6 → 3×7 → 3×8). Cuando logren hacer 3×8 limpias con buena técnica, suban lo mínimo la próxima sesión (+2,5 kg en tren superior / +5 kg en pierna) y vuelvan a empezar en 3×6.
Semana 5 en adelante (Bloque de Fuerza Pura): Una vez dominada la técnica de banca, sentadilla, remo y peso muerto, pasen el primer ejercicio de cada día a 4 series × 4-6 repeticiones (descansando 3 minutos completos) para trabajar con cargas bien pesadas manteniendo los accesorios en su rango.
Protocolo ante estancamiento: Si en algún ejercicio quedan trabados 2 o 3 sesiones seguidas sin poder subir repeticiones ni peso, bajen la carga un 10% en la sesión siguiente y vuelvan a construir desde ahí.
Fuera del gimnasio: Apunten a caminar 7.000 - 10.000 pasos diarios, dormir 7-8 horas y mantener un ligero déficit calórico (300-500 kcal menos de lo que gastan) incluyendo proteína en cada comida principal sin obsesionarse con suplementos.`;

/* ---------- parser de rutinas ---------- */
const SETS_RE = /(\d+)\s*[x×X]\s*(\d+(?:\s*[-–]\s*\d+)?)\s*(seg(?:undos)?|s\b|min)?\s*(c\/u|por lado)?/i;

function mkEx(name, typeTxt, m, rest) {
  name = name.trim();
  const star = /\*\s*$/.test(name);
  name = name.replace(/\s*\*\s*$/, '');
  const type = /b[aá]sico|principal|compuesto/i.test(typeTxt) ? 'Básico' : /accesorio|aislado/i.test(typeTxt) ? 'Accesorio' : (BASIC_RE.test(name) ? 'Básico' : 'Accesorio');
  const unit = m[3] ? (/min/i.test(m[3]) ? 'min' : 'seg') : '';
  rest = (rest || '').trim() || '90 seg';
  return { id: slug(name), name, type, sets: +m[1], reps: m[2].replace(/\s+/g, ''), unit, each: !!m[4], timed: !!unit, rest, restSec: restToSec(rest), star };
}
function parseExercise(line) {
  let cols = line.includes('|') ? line.split('|') : line.includes('\t') ? line.split('\t') : null;
  if (cols) {
    cols = cols.map(c => c.trim());
    const si = cols.findIndex((c, i) => i > 0 && SETS_RE.test(c));
    if (si < 1 || !cols[0]) return null;
    return mkEx(cols[0], cols.slice(1, si).join(' '), cols[si].match(SETS_RE), cols[si + 1] || '');
  }
  const m = line.match(SETS_RE);

  const name = line.slice(0, m.index).replace(/[\s:\-–—,·]+$/, '');
  const after = line.slice(m.index + m[0].length).replace(/^[\s,\-–—·]+/, '').replace(/^(descanso|desc\.?)\s*:?\s*/i, '');

}
function parseRoutine(text) {

  let day = null, stop = false;
  for (const line of lines) {
    if (/planilla|registro semanal/i.test(line)) { stop = true; continue; }
    if (stop) continue;
    if (/^\d+\.\s+[A-ZÁÉÍÓÚÑ ,/]+$/.test(line)) continue;
    if (/^ejercicio\b/i.test(line) && /serie/i.test(line)) continue;
    const dm = line.match(/^(d[ií]a\s*\d+|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b\s*[:\-–—]?\s*(.*)$/i);
    if (dm && !line.includes('|') && !SETS_RE.test(line)) {
      let rest = dm[2], focus = '';
      const fm = rest.match(/\(([^)]*)\)\s*$/);
      if (fm) { focus = fm[1]; rest = rest.slice(0, fm.index).trim(); }
      const label = cap(dm[1]);
      day = { label, name: rest ? titleCase(rest) : label, focus, exercises: [] };
      r.days.push(day); continue;
    }
    const ex = parseExercise(line);
    if (ex) { if (!day) { day = { label: 'Día 1', name: 'Día 1', focus: '', exercises: [] }; r.days.push(day); } day.exercises.push(ex); continue; }
    if (!r.days.length && !r.title) { r.title = line; continue; }
    if (!r.days.length && !r.subtitle && line.length < 160) { r.subtitle = line; continue; }
    r.notes.push(line);

  r.days.forEach(d => { let id = slug(d.name) || 'dia'; while (used[id]) id += '-2'; used[id] = 1; d.id = id;
    const u2 = {}; d.exercises.forEach(e => { while (u2[e.id]) e.id += '-2'; u2[e.id] = 1; }); });
  return r;
}
function serialize(r) {
  const out = [];
  if (r.title) out.push(r.title);
  if (r.subtitle) out.push(r.subtitle);
  r.days.forEach(d => {
    out.push('', `${d.label.toUpperCase()} – ${d.name.toUpperCase()}${d.focus ? ` (${d.focus})` : ''}`);
    d.exercises.forEach(e => out.push(`${e.name}${e.star ? ' *' : ''} | ${e.type} | ${e.sets} × ${e.reps}${e.unit ? ' ' + e.unit : ''}${e.each ? ' c/u' : ''} | ${e.rest}`));
  });

  return out.join('\n');
}
function loadJSZip() {
  if (window.JSZip) return Promise.resolve();
  return new Promise((ok, fail) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = ok;
    s.onerror = () => fail(new Error('No se pudo cargar el lector de Word (¿sin internet?)')); document.head.appendChild(s); });
}
async function docxToText(file) {
  await loadJSZip();
  const zip = await JSZip.loadAsync(file);
  const xml = await zip.file('word/document.xml').async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body = doc.getElementsByTagNameNS(W, 'body')[0];
  const pText = p => [...p.getElementsByTagNameNS(W, 't')].map(t => t.textContent).join('');
  const paras = el => [...el.getElementsByTagNameNS(W, 'p')].map(pText).filter(Boolean);
  const out = [];
  for (const node of body.children) {
    if (node.localName === 'p') out.push(pText(node));
    else if (node.localName === 'tbl') for (const tr of node.getElementsByTagNameNS(W, 'tr')) {
      const cells = [...tr.children].filter(c => c.localName === 'tc');
      if (cells.length === 1) out.push(...paras(cells[0])); else out.push(cells.map(c => paras(c).join(' ')).join(' | '));
    }
  }
  return out.join('\n');
}

  const mob = (MOB.find(([re]) => re.test(ex.name)) || [0, ['Movilidad articular general 2 min']])[1];

  if (window.supabase) return Promise.resolve();
  return new Promise((ok, fail) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = ok;
    s.onerror = () => fail(new Error('Sin conexión')); document.head.appendChild(s); });
}
function cloudSet(status, err = '') { cloud.status = status; cloud.err = err; const el = $('#cloudst'); if (el) el.innerHTML = cloudStatusHTML(); }
function cloudStatusHTML() {
  return { off: 'Sin conectar', sync: '⟳ Sincronizando…', ok: '✓ Sincronizado', offline: 'Sin conexión: se guarda en el celular', error: '⚠ ' + esc(cloud.err) }[cloud.status] || '';
}
async function cloudInit() {
  try { await loadSupabase(); } catch (e) { cloudSet('offline'); return; }
  cloud.sb = window.supabase.createClient(SB_URL, SB_KEY);
  cloud.sb.auth.onAuthStateChange((ev, session) => {
    const u = session ? session.user : null, changed = (u && u.id) !== (cloud.user && cloud.user.id);
    cloud.user = u;
    if (!changed) return;
    if (u) setTimeout(cloudPull, 0); else cloudSet('off');
    if (S.tab === 'cfg' && !$('.sheet')) render();
  });
}
/** Trae el estado de la nube si es más nuevo; si no, sube el local. */
async function cloudPull() {
  if (!cloud.user) return;
  cloudSet('sync');
  const { data, error } = await cloud.sb.from('rutinas_app_state').select('data, updated_at').maybeSingle();
  if (error) return cloudSet('error', error.message);
  const remoteT = data ? new Date(data.updated_at).getTime() : 0;
  const localEmpty = !Object.keys(S.logs || {}).length;
  if (data && data.data && data.data.routine && (remoteT > (S.updatedAt || 0) || localEmpty)) {
    const keep = { cd: S.cd, timers: S.timers, open: S.open, tab: S.tab };
    S = Object.assign(freshState(), data.data, keep); S.updatedAt = remoteT;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    closeSheet(); render(); toast('Datos traídos de la nube ☁');
  }
  await cloudPush();
}
function cloudQueue() { if (!cloud.user) return; clearTimeout(cloud.pushT); cloud.pushT = setTimeout(cloudPush, 2500); }
async function cloudPush() {
  if (!cloud.user || cloud.busy) return cloudQueue();
  cloud.busy = true; cloudSet('sync');
  try {
    const { cd, open, timers, ...data } = S;
    const r = await cloud.sb.from('rutinas_app_state').upsert({ user_id: cloud.user.id, data, updated_at: new Date(S.updatedAt || Date.now()).toISOString() });
    if (r.error) throw r.error;
    await syncSets();
    cloudSet('ok');
  } catch (e) { cloudSet('error', e.message || String(e)); }
  cloud.busy = false;
}
/** Persona cuyos pesos se mandan al historial de Progreso Gym. */
const cloudPerson = () => prof(S.cloudPid) || S.profiles[0];
/** Pasa las series de "tu" persona a la tabla workout_sets (solo lo que cambió). */
async function syncSets() {
  const p = cloudPerson(); if (!p) return;
  let synced = {}; try { synced = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) {}
  const now = {};
  for (const key in S.logs) {
    const [pid, w, dId, eId] = key.split('|');
    if (pid !== p.id || eId === '_gen') continue;
    const day = S.routine.days.find(d => d.id === dId), ex = day && day.exercises.find(e => e.id === eId);
    if (!ex) continue;
    const L = S.logs[key];
    const rows = filled(L).map(s => ({ kg: num(s.kg) ?? 0, reps: parseInt(s.reps, 10) || 0 })).filter(s => s.reps > 0);
    // registros viejos sin fecha: se estima por la semana (7 días por semana hacia atrás)
    const date = L.date || new Date(Date.parse(today()) - (p.week - +w) * 7 * 86400000).toISOString().slice(0, 10);
    now[key] = JSON.stringify([ex.name, date, rows]);
    if (synced[key] === now[key]) continue;
    const del = await cloud.sb.from('workout_sets').delete().eq('source_key', key);
    if (del.error) throw del.error;
    if (rows.length) {
      const ins = await cloud.sb.from('workout_sets').insert(rows.map((s, i) => ({
        exercise_name: ex.name, date, set_number: i + 1, weight_kg: s.kg, reps: s.reps, source_key: key })));
      if (ins.error) throw ins.error;
    }
    synced[key] = now[key];
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(synced)); } catch (e) {}
  }
  for (const key in synced) if (!(key in now)) {   // registros borrados en la app
    await cloud.sb.from('workout_sets').delete().eq('source_key', key);
    delete synced[key];
  }
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(synced)); } catch (e) {}
}
/** Reemplaza la rutina de Progreso Gym por la de esta app. */
async function pushRoutine() {
  const sb = cloud.sb, uid = cloud.user.id;
  const del = await sb.from('routine_days').delete().eq('user_id', uid);
  if (del.error) throw del.error;
  for (const [i, d] of S.routine.days.entries()) {
    const r = await sb.from('routine_days').insert({ name: `${d.label} · ${d.name}`, day_order: i }).select().single();
    if (r.error) throw r.error;
    const rows = d.exercises.map((e, j) => { const [a, b] = e.reps.split(/[-–]/).map(Number);
      return { day_id: r.data.id, name: e.name, sets: e.sets, rep_min: a, rep_max: b || a, mode: b && b !== a ? 'rango' : 'fijas',
        increment_kg: isLeg(e) ? 5 : 2.5, target_rir: 2, rest_sec: e.restSec, ex_order: j, notes: e.type }; });
    const x = await sb.from('routine_exercises').insert(rows);
    if (x.error) throw x.error;
  }
}

/* ---------- exportar historial (WhatsApp / IA / respaldo) ---------- */
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
function fmtDate(d) { const t = new Date(d + 'T12:00'); return `${DIAS[t.getDay()]} ${String(t.getDate()).padStart(2, '0')}/${String(t.getMonth() + 1).padStart(2, '0')}`; }
/** Agrupa los registros de una persona en entrenamientos (semana + día). */
function collectSessions(p, range) {
  const out = []; let maxW = 1;
  for (const key in S.logs) { const [pid, w] = key.split('|'); if (pid === p.id) maxW = Math.max(maxW, +w); }
  for (let w = 1; w <= maxW; w++) S.routine.days.forEach(day => {
    const gen = S.logs[lk(day, { id: '_gen' }, w, p.id)];
    const items = day.exercises.map((e0, i) => { const ex = eff(e0, i, w); return { ex, L: S.logs[lk(day, ex, w, p.id)] }; });
    const has = items.some(({ L }) => L && (filled(L).length || L.done || L.note || L.skipped)) || (gen && (gen.note || gen.done));
    if (!has) return;
    const dates = [gen, ...items.map(x => x.L)].filter(L => L && L.date).map(L => L.date).sort();
    out.push({ w, day, date: dates[0] || null, gen, items });
  });
  out.sort((a, b) => a.w - b.w || (a.date && b.date ? a.date.localeCompare(b.date) : 0));
  if (range === 'last') return out.slice(-1);
  if (range === 'week') return out.filter(s => s.w === p.week);
  if (range === 'today') { const d = S.routine.days[p.day]; return out.filter(s => s.w === p.week && s.day.id === d.id); }
  return out;
}
function setsText(L, ex) {
  const f = filled(L);
  if (!f.length) return L && L.done ? 'hecho (sin pesos anotados)' : '';
  const reps = s => s.reps !== '' ? s.reps : '?', kgOf = s => num(s.kg) ? fmtKg(num(s.kg)) : '';
  if (ex.timed) { const kg = f.map(kgOf).find(Boolean); return f.map(s => reps(s) + ' seg').join(' / ') + (kg ? ` (con ${kg} kg)` : ''); }
  const kgs = [...new Set(f.map(kgOf))];
  if (f.every(s => s.reps === '')) {   // solo se anotó el peso
    const ks = f.map(kgOf);
    return ks.every(Boolean) ? `${kgs.length === 1 ? ks[0] : ks.join(' / ')} kg · reps sin anotar` : `${f.length} series · sin datos de peso ni reps`;
  }
  if (kgs.length === 1) return kgs[0] ? `${kgs[0]} kg × ${f.map(reps).join(' / ')}` : `${f.map(reps).join(' / ')} reps (sin peso)`;
  return f.map(s => `${kgOf(s) ? kgOf(s) + ' kg' : 'sin peso'} × ${reps(s)}`).join(' · ');
}
const RANGE_TXT = { last: 'último entreno', week: 'semana actual', all: 'todo el historial', today: 'entreno de hoy' };
function exportText(sessions, p, range) {
  const out = [`🏋️ *Historial de entrenamiento – ${p.name}*`];
  if (S.routine.title) out.push(`Rutina: ${S.routine.title}`);
  out.push(`Exportado: ${fmtDate(today())}/${today().slice(0, 4)} · ${RANGE_TXT[range] || ''}`);
  out.push('Formato: peso × repeticiones de cada serie. Entre paréntesis, el objetivo de la rutina.');
  if (!sessions.length) { out.push('', 'Todavía no hay entrenamientos registrados en este rango.'); return out.join('\n'); }
  let curW = 0;
  for (const s of sessions) {
    if (s.w !== curW) { curW = s.w; out.push('', '━━━━━━━━━━━━', `*SEMANA ${s.w}*`); }
    out.push('', `📅 *${s.date ? fmtDate(s.date) + ' · ' : ''}${s.day.name}*`);
    if (s.gen && s.gen.done) out.push(`🔥 Entrada en calor: ${s.gen.mode || 'Cardio'} ${s.gen.dur || ''} min`.trim());
    if (s.gen && s.gen.note && s.gen.note.trim()) out.push(`📝 ${s.gen.note.trim()}`);
    for (const { ex, L } of s.items) {
      const obj = `(${ex.sets}×${ex.reps}${ex.unit ? ' ' + ex.unit : ''})`;
      const v = L && L.skipped ? '❌ No lo hice' : setsText(L, ex);
      if (!v) { out.push(`• ${ex.name} — _sin registrar_`); }
      else { out.push(`• *${ex.name}* ${obj}`, `   ${v}`); }
      const t = L ? tval(lk(s.day, ex, s.w, p.id)) : 0;
      if (t >= 30 && !(L && L.skipped)) out[out.length - 1] += ` · ⏱ ${fmtT(t)}`;
      if (L && L.note && L.note.trim()) out.push(`   _Nota: ${L.note.trim()}_`);
    }
  }
  out.push('', '_Generado con Rutinas Gym_');
  return out.join('\n');
}
function exportJSON(sessions, p) {
  return {
    usuario: p.name, rutina: S.routine.title || '', exportado: today(),
    sesiones: sessions.map(s => ({
      fecha: s.date, semana: s.w, dia: s.day.name,
      ...(s.gen && s.gen.note ? { nota: s.gen.note } : {}),
      ...(s.gen && s.gen.done ? { entrada_en_calor: `${s.gen.mode || 'Cardio'} ${s.gen.dur || ''} min`.trim() } : {}),
      ejercicios: s.items.map(({ ex, L }) => {
        const o = { nombre: ex.name, objetivo: `${ex.sets}x${ex.reps}${ex.unit ? ' ' + ex.unit : ''}` };
        if (L && L.skipped) o.omitido = true;
        else if (!L || (!filled(L).length && !L.done)) o.sin_registrar = true;
        else o.series = filled(L).map(x => ex.timed ? { peso_kg: num(x.kg) || 0, duracion_seg: num(x.reps) } : { peso_kg: num(x.kg), reps: num(x.reps) });
        if (L && L.note) o.nota = L.note;
        return o;
      })
    }))
  };
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
}
function download(name, content, type) {
  const u = URL.createObjectURL(new Blob([content], { type })), A = document.createElement('a');
  A.href = u; A.download = name; A.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
async function doExport(a, r) {
  const p = P(), range = r || S.xrange || 'week', ses = collectSessions(p, range);
  if (!ses.length) { toast('No hay entrenamientos en ese rango'); return; }
  const text = exportText(ses, p, range), base = `historial-${slug(p.name)}-${today()}`;
  if (a === 'xtxt') { download(base + '.txt', text, 'text/plain;charset=utf-8'); return; }
  if (a === 'xjson') { download(base + '.json', JSON.stringify(exportJSON(ses, p), null, 2), 'application/json'); return; }
  if (a === 'xshare' && navigator.share) {
    try { await navigator.share({ title: `Historial – ${p.name}`, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  toast(await copyText(text) ? '📋 Copiado: pegalo en WhatsApp' : 'No se pudo copiar');
}

/* ---------- importar historial (JSON con "sesiones") ---------- */
const STOP = new Set(['de', 'con', 'en', 'o', 'la', 'el', 'al', 'y', 'a', 'del', 'los', 'las', 'por']);
const toks = s => slug(s).split('-').filter(t => t.length > 1 && !STOP.has(t));
function matchDay(name) { const s = slug(name); return S.routine.days.find(d => s === d.id || s.startsWith(d.id + '-')) || S.routine.days.find(d => s.includes(d.id)); }
function matchEx(day, name) {
  const t = toks(name); if (!t.length) return null;
  let best = null, bs = 0;
  day.exercises.forEach(e => { const et = new Set(toks(e.name)); const sc = t.filter(x => et.has(x)).length / t.length; if (sc > bs) { bs = sc; best = e; } });
  return bs >= 0.5 ? best : null;
}
function monday(ds) { const t = new Date(ds + 'T12:00'); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function importSessions(d, p) {
  const ses = d.sesiones.filter(s => s && s.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const m0 = ses.length ? monday(ses[0].fecha) : null;
  const ops = [], skipped = []; let n = 0, used = 0;
  for (const s of ses) {
    const day = matchDay(s.dia || ''), exs = s.ejercicios || [];
    if (!day) { if (exs.length) skipped.push(`${s.dia} (${s.fecha})`); continue; }
    const w = s.semana || Math.round((monday(s.fecha) - m0) / (7 * 864e5)) + 1; used++;
    const extra = ((s.dia || '').match(/\(([^)]*)\)/) || [])[1];
    ops.push({ w, day, gen: true, date: s.fecha, note: [s.nota, extra].filter(Boolean).join(' · ') });
    for (const x of exs) { const e = matchEx(day, x.nombre || ''); if (!e) { skipped.push(x.nombre); continue; } n++; ops.push({ w, day, ex: e, x, date: s.fecha }); }
  }
  return { n, ses: used, skipped: [...new Set(skipped)], apply() {
    let maxW = p.week;
    for (const o of ops) {
      maxW = Math.max(maxW, o.w);
      if (o.gen) { const g = getLog(o.day, { id: '_gen' }, 0, o.w, p.id); g.date = g.date || o.date; if (o.note) g.note = o.note; continue; }
      const L = getLog(o.day, o.ex, 0, o.w, p.id), x = o.x; L.date = o.date;
      if (x.omitido || x.sin_registrar) { L.sets = []; L.skipped = !!x.omitido; L.done = !!x.omitido; }
      else {
        L.sets = (x.series || []).map(s => ({ kg: s.peso_kg ? String(s.peso_kg) : '', reps: s.reps != null ? String(s.reps) : s.duracion_seg != null ? String(s.duracion_seg) : '', done: true }));
        L.done = true; L.skipped = false;
      }
      if (x.nota) L.note = x.nota;
    }
    p.week = maxW;
  } };
}

function exCard(day, e0, i) {
  const ex = eff(e0, i), L = getLog(day, ex, ex.sets), k = lk(day, ex), open = !!S.open[k];
  const sum = fmtLog(L, ex);
  return `<article class="ex ${ex.type === 'Básico' ? 'basic' : ''} ${L.done ? 'done' : ''} ${L.skipped ? 'skipped' : ''} ${open ? 'open' : ''}" data-exk="${k}">
    <div class="exh"><button class="tick ${L.done ? 'on' : ''}" data-a="exdone" data-k="${k}" aria-label="Marcar ${esc(ex.name)} como hecho">✓</button>
      <button class="exname" data-a="open" data-k="${k}" aria-expanded="${open}"><b>${esc(ex.name)}${ex.star ? ' *' : ''}</b>
        <span class="meta">${ex.sets} × ${esc(ex.reps)}${ex.unit ? ' ' + ex.unit : ''}${ex.each ? ' c/u' : ''} · desc. ${fmtT(ex.restSec)}${ex.type === 'Básico' ? '<em>Básico</em>' : ''}${ex.strength ? '<em class="f">Fuerza</em>' : ''}</span>
        ${!open && L.skipped ? '<span class="sum">No lo hice</span>' : !open && sum ? `<span class="sum">${esc(sum)}</span>` : `<span class="dots">${L.sets.slice(0, ex.sets).map(s => `<i class="${s.done ? 'on' : ''}"></i>`).join('')}</span>`}
      </button><span class="chev" aria-hidden="true">⌄</span></div>
    ${open ? `<div class="exb">${detail(day, ex, L, k, i)}</div>` : ''}</article>`;
}

function phKg(L, last, i) {
  for (let j = i - 1; j >= 0; j--) if (L.sets[j].kg) return L.sets[j].kg;   // mismo peso que la serie anterior
  return (last && last.log.sets[i] && last.log.sets[i].kg) || '';
}

function detail(day, ex, L, k, idx) {
  const last = lastLog(day, ex), sug = suggestion(ex, last);
  const { mob, apr } = warmItems(ex, null), wt = mob.length + apr.length;
  const wd = Object.values(L.warm).filter(Boolean).length;
  const t = S.timers[k], running = t && t.start;
  const star = ex.star && S.routine.notes.find(n => n.startsWith('*'));
  let h = '';
  if (last) h += `<div class="last">Última vez (sem ${last.w}): <b>${esc(fmtLog(last.log, ex))}</b>${sug ? `<span class="up">↑ ${esc(sug)}</span>` : ''}</div>`;
  if (star) h += `<div class="note">${esc(star.replace(/^\*\s*/, ''))}</div>`;
  // precalentamiento: siempre plegado, es opcional (se puede ocultar del todo en Personas)
  if (S.showWarm !== false) h += `<details class="warm"><summary><span>🔥 Precalentamiento <em>opcional</em></span><small>${wd ? `${Math.min(wd, wt)}/${wt}` : 'Ver'}</small></summary><div class="wl" data-warm="${k}">${warmHTML(ex, L, k, baseKg(L, last))}</div></details>`;
  h += `<div class="sets-h"><span>#</span><span>Kg</span><span>${ex.timed ? 'Segundos' : 'Reps'}</span><span>✓</span></div>`;
  for (let i = 0; i < ex.sets; i++) {
    const s = L.sets[i], ph = (last && last.log.sets[i]) || {};
    h += `<div class="set ${s.done ? 'ok' : ''}"><span class="sn">${i + 1}</span>
      <div class="stp"><button data-a="step" data-k="${k}" data-i="${i}" data-f="kg" data-d="-2.5" aria-label="Menos peso">−</button><input inputmode="decimal" data-in="kg" data-k="${k}" data-i="${i}" value="${esc(s.kg)}" placeholder="${esc(phKg(L, last, i) || 'kg')}" aria-label="Kilos serie ${i + 1}"><button data-a="step" data-k="${k}" data-i="${i}" data-f="kg" data-d="2.5" aria-label="Más peso">+</button></div>
      <div class="stp"><button data-a="step" data-k="${k}" data-i="${i}" data-f="reps" data-d="-1" aria-label="Menos">−</button><input inputmode="numeric" data-in="reps" data-k="${k}" data-i="${i}" value="${esc(s.reps)}" placeholder="${esc(ph.reps || ex.reps)}" aria-label="${ex.timed ? 'Segundos' : 'Repeticiones'} serie ${i + 1}"><button data-a="step" data-k="${k}" data-i="${i}" data-f="reps" data-d="1" aria-label="Más">+</button></div>
      <button class="tick sm ${s.done ? 'on' : ''}" data-a="set" data-k="${k}" data-i="${i}" aria-label="Serie ${i + 1} hecha">✓</button></div>`;
  }
  const hasNext = idx < day.exercises.length - 1;
  h += `<div class="tools">
    <div class="swbox"><div class="grow"><small>Tiempo en el ejercicio</small><span class="clock" data-timer="${k}">${fmtT(tval(k))}</span></div>
      <button class="btn sm ${running ? 'ghost' : ''}" data-a="sw" data-k="${k}">${running ? 'Pausar' : (t && t.acc ? 'Seguir' : '▶ Iniciar')}</button>
      ${t ? `<button class="btn sm ghost" data-a="swreset" data-k="${k}" aria-label="Reiniciar cronómetro">↺</button>` : ''}</div>
    <button class="btn ghost" data-a="rest" data-k="${k}">⏱ Descanso ${fmtT(ex.restSec)}</button>
    <button class="btn ghost" data-a="next" data-k="${k}">${hasNext ? 'Siguiente →' : 'Cerrar'}</button></div>
  <details class="nt" ${L.note ? 'open' : ''}><summary>📝 ${L.note ? 'Nota' : 'Agregar nota'}</summary>
    <textarea data-note="${k}" rows="2" maxlength="300" placeholder="Ej: molestia en la espalda, peso aproximado, lo hice en casa…">${esc(L.note || '')}</textarea></details>
  <button class="skip" data-a="skip" data-k="${k}">${L.skipped ? '↺ Lo hice al final' : 'Hoy no lo hice'}</button>`;
  return h;
}

function renderTrain() {
  const p = P(), r = S.routine;
  if (!r.days.length) return `<div class="empty">Todavía no hay rutina.<br><br><button class="btn" data-a="tab" data-v="rutina">Cargar rutina</button></div>`;
  p.day = Math.min(p.day || 0, r.days.length - 1);
  const day = r.days[p.day], pr = prog(day);
  const strong = S.strength.on && p.week >= S.strength.from;
  let h = `<div class="days">${r.days.map((d, i) => { const q = prog(d), full = q.total && q.done === q.total;
      return `<button class="day ${i === p.day ? 'on' : ''} ${full ? 'full' : ''}" data-a="day" data-v="${i}"><b>${esc(d.name)}</b><small>${full ? '✓ Completo' : `${esc(d.label)} · ${q.done}/${q.total}`}</small></button>`; }).join('')}</div>
    <section class="hero"><div class="hero-top"><div><small>${esc(day.label)}${day.focus ? ' · ' + esc(day.focus) : ''}</small><h2>${esc(day.name)}</h2></div>
      <div class="wk"><button data-a="week" data-v="-1" aria-label="Semana anterior">‹</button><span>Sem ${p.week}</span><button data-a="week" data-v="1" aria-label="Semana siguiente">›</button></div></div>
      ${strong ? '<span class="tag">Bloque de fuerza</span>' : ''}
      <div class="prog"><div class="bar"><i style="width:${pr.total ? pr.done / pr.total * 100 : 0}%"></i></div><span>${pr.done}/${pr.total}</span></div></section>`;
  h += genCard(day);
  h += day.exercises.map((e, i) => exCard(day, e, i)).join('');
  const gl = getLog(day, { id: '_gen' }, 0);
  h += `<details class="nt card" ${gl.note ? 'open' : ''} style="padding:8px 14px"><summary>📝 Nota del día ${gl.note ? '' : '<small style="font-weight:400">(ej: entrené en casa, dormí mal)</small>'}</summary>
    <textarea data-dnote="${day.id}" rows="2" maxlength="300" placeholder="Cómo te sentiste, dónde entrenaste…">${esc(gl.note || '')}</textarea></details>`;
  if (pr.total && pr.done === pr.total) {
    const tot = day.exercises.reduce((a, e) => a + tval(lk(day, e)), 0);
    h += `<section class="card done-card"><b>🎉 ¡${esc(day.name)} completo!</b>${tot > 0 ? `Tiempo en ejercicios: ${fmtT(tot)}` : 'Buen entrenamiento'}${S.profiles.length > 1 ? `<br>${esc(p.name)}, semana ${p.week}` : ''}
      <div class="share"><button class="btn" data-a="xshare" data-r="today">📤 Compartir este entreno</button></div></section>`;
  }
  return h;
}

function renderHist() {
  const r = S.routine, p = P();
  if (!r.days.length) return `<div class="empty">No hay rutina cargada.</div>`;
  let any = false;
  const xr = S.xrange || 'week', msg = exportText(collectSessions(p, xr), p, xr);
  let h = `<section class="card"><h3>📤 Compartir historial</h3><p>Mandalo por WhatsApp, guardalo como respaldo o pasáselo a una IA.</p>
    <div class="seg sm" style="margin-top:0">${[['last', 'Último entreno'], ['week', `Semana ${p.week}`], ['all', 'Todo']].map(([v, t]) => `<button class="${xr === v ? 'on' : ''}" data-a="xrange" data-v="${v}">${t}</button>`).join('')}</div>
    <div class="share"><button class="btn" data-a="xshare">📤 Compartir</button><button class="btn ghost" data-a="xcopy">📋 Copiar</button>
      <button class="btn ghost sm" data-a="xtxt">⬇ Descargar .txt</button><button class="btn ghost sm" data-a="xjson">⬇ Descargar JSON</button></div>
    <details><summary style="cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0 0">Ver el mensaje</summary><pre class="msg">${esc(msg)}</pre></details></section>
    <section class="card"><h3>Historial de ${esc(p.name)}</h3><p>Peso × repeticiones de cada semana. Tocá otra persona arriba para ver el suyo.</p></section>`;
  r.days.forEach(d => {
    h += `<div class="hday">${esc(d.label)} · ${esc(d.name)}</div>`;
    d.exercises.forEach(e => {
      const rows = [];
      for (let w = Math.max(p.week, 12); w >= 1; w--) { const L = S.logs[lk(d, e, w)]; if (!L) continue;
        const v = L.skipped ? 'No lo hice' : setsText(L, e);
        if (v || L.note) rows.push(`<div class="hw ${w === p.week ? 'cur' : ''}"><span>Sem ${w}${L.date ? ' · ' + fmtDate(L.date) : ''}</span><span style="text-align:right">${esc(v || '—')}${L.note ? `<span class="nn">${esc(L.note)}</span>` : ''}</span></div>`); }
      if (rows.length) any = true;
      h += `<div class="card hex"><b>${esc(e.name)}</b>${rows.length ? rows.join('') : '<div class="hw"><span>Sin registros todavía</span></div>'}</div>`;
    });
  });
  if (!any) h = h.replace('</section>', '<p class="hint">Cuando cargues pesos en “Entrenar” aparecen acá.</p></section>');
  return h;
}

}

/* ---------- hojas (personas) ---------- */
function renderPeople0() {
  $('#people').innerHTML = ''; $('#app').innerHTML = '';
  openSheet(`<h2>¿Quiénes entrenan? 💪</h2><p>Comparten la misma rutina y cada uno guarda sus pesos. Podés agregar más después.</p>
    <div id="fl">${[0, 1].map(i => `<div class="fld" style="--c:${COLORS[i]}"><i></i><input placeholder="Persona ${i + 1}${i ? ' (opcional)' : ''}" maxlength="20"></div>`).join('')}</div>
    <button class="btn ghost wide sm" data-a="flmore" style="margin-top:0">+ Otra persona</button>
    <button class="btn wide" data-a="flok">Empezar</button>
    <button class="btn ghost wide sm" data-a="loginsheet">☁ Ya tengo cuenta: iniciar sesión</button>`);
}
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet"><div class="in">${html}</div></div>`; const i = $('#sheet input'); if (i) setTimeout(() => i.focus(), 50); }
function closeSheet() { $('#sheet').innerHTML = ''; }
function addProfile(name) {
  const used = S.profiles.map(p => p.color);
  const p = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: name.trim() || `Persona ${S.profiles.length + 1}`,
              color: COLORS.find(c => !used.includes(c)) || COLORS[S.profiles.length % COLORS.length], week: 1, day: 0 };
  S.profiles.push(p); return p;
}

/* ---------- acciones ---------- */
function openNext(k) {
  const { day, i } = findEx(k);
  for (const key in S.open) if (key.startsWith(`${S.pid}|${P().week}|`)) delete S.open[key];
  for (let j = i + 1; j < day.exercises.length; j++) { const e = eff(day.exercises[j], j), L = S.logs[lk(day, e)];
    if (!L || !L.done) { S.open[lk(day, e)] = true; return lk(day, e); } }
  return null;
}
function scrollToEx(k) { if (!k) return; requestAnimationFrame(() => { const el = document.querySelector(`[data-exk="${k}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); }
function refreshPlaceholders(k) {
  const { day, ex } = findEx(k), L = getLog(day, ex, ex.sets), last = lastLog(day, ex);
  $$(`input[data-in="kg"][data-k="${k}"]`).forEach(el => { el.placeholder = phKg(L, last, +el.dataset.i) || 'kg'; });
  const w = document.querySelector(`[data-warm="${k}"]`); if (w) w.innerHTML = warmHTML(ex, L, k, baseKg(L, last));
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT') return;
  const a = el.dataset.a, k = el.dataset.k;
  let scrollK = null;
  switch (a) {
    case 'tab': S.tab = el.dataset.v; window.scrollTo(0, 0); break;
    case 'who': if (S.pid === el.dataset.v && S.tab === 'train') return; S.pid = el.dataset.v; if (S.tab === 'cfg') S.tab = 'train'; toast(`Entrenando: ${P().name}`); window.scrollTo(0, 0); break;
    case 'addp': openSheet(`<h2>Nueva persona</h2><p>Va a usar la misma rutina con sus propios pesos.</p>
        <div class="fld" style="--c:${COLORS[S.profiles.length % COLORS.length]}"><i></i><input id="np" placeholder="Nombre" maxlength="20"></div>
        <button class="btn wide" data-a="addok">Agregar</button><button class="btn ghost wide" data-a="sheetx">Cancelar</button>`); return;
    case 'addok': { const p = addProfile($('#np').value); S.pid = p.id; S.tab = 'train'; closeSheet(); toast(`Entrenando: ${p.name}`); break; }
    case 'sheetx': closeSheet(); if (!S.profiles.length) renderPeople0(); return;
    case 'loginsheet': openSheet(`<h2>Iniciar sesión ☁</h2><p>Traé tus personas, pesos y rutina guardados en la nube.</p>${loginForm()}
        <button class="btn ghost wide" data-a="sheetx">Volver</button>`); return;
    case 'login': case 'signup': doLogin(a === 'signup'); return;
    case 'logout': cloud.sb.auth.signOut(); toast('Sesión cerrada. Los datos quedan en este celular.'); return;
    case 'syncnow': cloudPull(); return;
    case 'pushrt': if (!confirm('Esto reemplaza los días y ejercicios de Progreso Gym por esta rutina (el historial de series se conserva). ¿Seguir?')) return;
      pushRoutine().then(() => toast('Rutina enviada a Progreso Gym ✓')).catch(e => alert('No se pudo enviar: ' + e.message)); return;
    case 'flmore': { const n = $$('#fl .fld').length; if (n >= 6) return; $('#fl').insertAdjacentHTML('beforeend', `<div class="fld" style="--c:${COLORS[n]}"><i></i><input placeholder="Persona ${n + 1} (opcional)" maxlength="20"></div>`); $$('#fl input')[n].focus(); return; }
    case 'flok': { const names = [...$$('#fl input')].map(i => i.value.trim()).filter(Boolean); (names.length ? names : ['Yo']).forEach(addProfile);
      S.pid = S.profiles[0].id; closeSheet(); break; }
    case 'pcolor': { const p = prof(el.dataset.v); p.color = COLORS[(COLORS.indexOf(p.color) + 1) % COLORS.length]; break; }
    case 'pdel': { const p = prof(el.dataset.v);
      if (!confirm(`¿Borrar a ${p.name} y todos sus registros? No se puede deshacer.`)) return;
      S.profiles = S.profiles.filter(x => x.id !== p.id);
      for (const key in S.logs) if (key.startsWith(p.id + '|')) delete S.logs[key];
      for (const key in S.timers) if (key.startsWith(p.id + '|')) delete S.timers[key];
      for (const key in S.cd) if (S.cd[key].pid === p.id) delete S.cd[key];
      if (S.pid === p.id) S.pid = S.profiles[0].id; break; }
    case 'week': P().week = Math.max(1, P().week + +el.dataset.v); break;
    case 'day': P().day = +el.dataset.v; break;
    case 'open': { const was = S.open[k];
      for (const key in S.open) if (key.startsWith(`${S.pid}|${P().week}|`)) delete S.open[key];
      if (!was) { S.open[k] = true; scrollK = k; } break; }
    case 'gendone': case 'gmode': case 'gdur': case 'gstart': {
      const day = S.routine.days[P().day], g = getLog(day, { id: '_gen' }, 0), gk = lk(day, { id: '_gen' });
      g.mode = g.mode || 'Bicicleta'; g.dur = g.dur || 8;
      if (a === 'gendone') { g.done = !g.done; delete S.open[gk]; if (g.done) { delete S.cd['cardio-' + S.pid]; buzz(20); } }
      if (a === 'gmode') g.mode = el.dataset.v;
      if (a === 'gdur') g.dur = +el.dataset.v;
      if (a === 'gstart') startCd('cardio-' + S.pid, g.dur * 60, `${g.mode} · ${g.dur} min`, 'cardio', { key: gk });
      break; }
    case 'skip': { const { day, ex } = findEx(k), L = getLog(day, ex, ex.sets);
      L.skipped = !L.skipped; L.done = L.skipped; stamp(L); buzz(20);
      if (L.skipped) { stopTimer(k); scrollK = openNext(k); if (!scrollK) delete S.open[k]; } break; }
    case 'xrange': S.xrange = el.dataset.v; break;
    case 'xshare': case 'xcopy': case 'xtxt': case 'xjson': doExport(a, el.dataset.r); return;
    case 'importsheet': openSheet(`<h2>Importar historial</h2><p>Pegá el JSON de tu historial (con "sesiones") o elegí el archivo. Se carga en <b>${esc(P().name)}</b>.</p>
        <textarea class="rt" id="imptxt" rows="8" placeholder='{ "usuario": "...", "sesiones": [ ... ] }'></textarea>
        <label class="btn ghost wide" style="cursor:pointer">📄 Elegir archivo .json<input type="file" accept=".json,.txt" data-file="imphist" hidden></label>
        <button class="btn wide" data-a="importok">Importar</button><button class="btn ghost wide" data-a="sheetx">Cancelar</button>`); return;
    case 'importok': { let d; try { d = JSON.parse($('#imptxt').value.replace(/^\s*json\s*/i, '')); } catch (e) { alert('El texto no es un JSON válido. Copiá solo la parte que empieza con { y termina con }.'); return; }
      if (!d || !Array.isArray(d.sesiones)) { alert('No encontré "sesiones" en ese JSON.'); return; }
      const r = importSessions(d, P());
      if (!confirm(`Se van a cargar ${r.n} ejercicios de ${r.ses} entrenamientos en ${P().name}${r.skipped.length ? `.\n\nNo encontré en la rutina: ${r.skipped.join(', ')}` : ''}.\n\nSi esas semanas ya tenían datos, se reemplazan. ¿Seguir?`)) return;
      r.apply(); closeSheet(); S.tab = 'hist'; toast(`Historial importado: ${r.n} ejercicios`); break; }
    case 'exdone': { const { day, ex } = findEx(k), L = getLog(day, ex, ex.sets); L.done = !L.done; L.skipped = false; stamp(L); buzz(20);
      if (L.done) { stopTimer(k); if (S.cd['rest-' + S.pid]) delete S.cd['rest-' + S.pid]; if (S.open[k]) scrollK = openNext(k); else delete S.open[k]; } break; }
    case 'set': { const { day, ex } = findEx(k), L = getLog(day, ex, ex.sets), i = +el.dataset.i, s = L.sets[i];
      s.done = !s.done; buzz(20);
      if (s.done) {
        stamp(L);
        const last = lastLog(day, ex), ph = (last && last.log.sets[i]) || {};
        if (s.kg === '') s.kg = phKg(L, last, i);
        if (s.reps === '') s.reps = ph.reps || '';
        if (L.sets.slice(0, ex.sets).every(x => x.done)) {
          L.done = true; stopTimer(k); delete S.cd['rest-' + S.pid];
          toast(`✓ ${ex.name}`); scrollK = openNext(k);
        } else startCd('rest-' + S.pid, ex.restSec, `${ex.name} · serie ${i + 1}/${ex.sets}`, 'rest');
      } else L.done = false;
      break; }
    case 'step': { const { day, ex } = findEx(k), L = getLog(day, ex, ex.sets), i = +el.dataset.i, f = el.dataset.f, d = num(el.dataset.d);
      const inp = document.querySelector(`input[data-in="${f}"][data-k="${k}"][data-i="${i}"]`);
      // si está vacío, el primer toque usa la sugerencia (peso anterior o mínimo de reps)
      const cur = num(L.sets[i][f]), ph = num(inp && inp.placeholder);
      const v = Math.max(0, Math.round((cur == null ? (ph ?? Math.max(0, d)) : cur + d) * 100) / 100);
      L.sets[i][f] = String(v); if (inp) inp.value = String(v); stamp(L); buzz(8); save();
      if (f === 'kg') refreshPlaceholders(k);
      return; }
    case 'sw': { audio(); wake(); const t = S.timers[k] || (S.timers[k] = { acc: 0, start: null });
      if (t.start) stopTimer(k); else t.start = Date.now(); break; }
    case 'swreset': delete S.timers[k]; break;
    case 'rest': { const { ex } = findEx(k); startCd('rest-' + S.pid, ex.restSec, ex.name, 'rest'); return; }
    case 'next': scrollK = openNext(k); if (!scrollK) delete S.open[k]; break;
    case 'cdadd': { const c = S.cd[el.dataset.v]; if (c) { const d = +el.dataset.d; c.end += d * 1000; c.total = Math.max(1, c.total + d); save(); tick(); } return; }
    case 'cdstop': delete S.cd[el.dataset.v]; save(); if (S.tab === 'train') break; tick(); return;
    case 'preview': $('#pv').innerHTML = preview(parseRoutine($('#rtext').value)); return;
    case 'apply': { const r = parseRoutine($('#rtext').value);
      if (!r.days.length) { $('#pv').innerHTML = preview(r); return; }
      S.routine = r; S.profiles.forEach(p => p.day = 0); S.tab = 'train'; toast('Rutina guardada'); window.scrollTo(0, 0); break; }
    case 'export': { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), A = document.createElement('a'); A.href = u; A.download = `rutinas-gym-${new Date().toISOString().slice(0, 10)}.json`; A.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
    case 'wipe': { const p = P(); if (!confirm(`¿Borrar todos los pesos y tiempos de ${p.name}? La rutina y las demás personas no se tocan. No se puede deshacer.`)) return;
      for (const key in S.logs) if (key.startsWith(p.id + '|')) delete S.logs[key];
      for (const key in S.timers) if (key.startsWith(p.id + '|')) delete S.timers[key];
      p.week = 1; toast('Registros borrados'); break; }
    default: return;
  }
  save(); render(); scrollToEx(scrollK);
});

document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.dataset.a === 'warm') { const { day, ex } = findEx(el.dataset.k); getLog(day, ex, ex.sets).warm[el.dataset.w] = el.checked; buzz(8); save();
    el.closest('label').classList.toggle('ok', el.checked);
    const L = getLog(day, ex, ex.sets), tot = el.closest('.wl').querySelectorAll('input').length, dn = Object.values(L.warm).filter(Boolean).length;
    const sm = el.closest('details').querySelector('summary small'); if (sm) sm.textContent = `${Math.min(dn, tot)}/${tot}`;
    if (dn >= tot) el.closest('details').open = false; }
  if (el.dataset.set === 'strOn') { S.strength.on = el.checked; save(); }
  if (el.dataset.set === 'strFrom') { S.strength.from = Math.max(1, +el.value || 5); save(); }
  if (el.dataset.set === 'cloudPid') {
    const old = cloudPerson().id; S.cloudPid = el.value; save();
    if (cloud.user && old !== el.value) {   // saca del historial los pesos de la persona anterior
      await cloud.sb.from('workout_sets').delete().like('source_key', old + '|%');
      try { localStorage.removeItem(SYNC_KEY); } catch (e) {}
      cloudPush(); toast(`Ahora se sincronizan los pesos de ${cloudPerson().name}`);
    }
  }
  if (el.dataset.set === 'showWarm') { S.showWarm = el.checked; save(); }
  if (el.dataset.file === 'imphist' && el.files[0]) { $('#imptxt').value = await el.files[0].text(); el.value = ''; }
  if (el.dataset.set === 'awake') { S.keepAwake = el.checked; save(); if (!el.checked && WL) { WL.release(); WL = null; } else wake(); }
  if (el.dataset.pname) { const p = prof(el.dataset.pname); p.name = el.value.trim() || p.name; save(); renderPeople(); }
  if (el.dataset.file === 'routine' && el.files[0]) {
    const f = el.files[0];
    try {
      const txt = /\.docx$/i.test(f.name) ? await docxToText(f) : await f.text();
      const r = parseRoutine(txt);
      $('#rtext').value = r.days.length ? serialize(r) : txt;
      if (r.days.length) { $('#pv').innerHTML = preview(r) + '<div class="btns"><button class="btn wide" data-a="apply">Usar esta rutina</button></div>'; }
      else { $('#pv').innerHTML = preview(r); $('#rtext').closest('details').open = true; }
    } catch (e) { $('#pv').innerHTML = `<p style="color:var(--danger)">${esc(e.message)}</p>`; }
    el.value = '';
  }
  if (el.dataset.file === 'backup' && el.files[0]) {
    try { const d = JSON.parse(await el.files[0].text()); if (!d.routine || !d.logs || !d.profiles) throw new Error();
      S = Object.assign(freshState(), d); S.cd = S.cd || {}; save(); render(); toast('Copia restaurada'); }
    catch (e) { alert('Ese archivo no es una copia válida de esta versión de la app.'); }
    el.value = '';
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.note) { const { day, ex } = findEx(el.dataset.note), L = getLog(day, ex, ex.sets); L.note = el.value; if (el.value.trim()) stamp(L); save(); return; }
  if (el.dataset.dnote) { const day = S.routine.days.find(d => d.id === el.dataset.dnote), g = getLog(day, { id: '_gen' }, 0); g.note = el.value; if (el.value.trim()) stamp(g); save(); return; }
  if (!el.dataset.in) return;
  const { day, ex } = findEx(el.dataset.k), L = getLog(day, ex, ex.sets);
  L.sets[+el.dataset.i][el.dataset.in] = el.value.trim();
  stamp(L); save();
  if (el.dataset.in === 'kg') refreshPlaceholders(el.dataset.k);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.closest('.sheet')) { const b = $('.sheet [data-a="addok"], .sheet [data-a="flok"]'); if (b) b.click(); }
});
document.addEventListener('pointerdown', () => { audio(); if (S.tab === 'train') wake(); }, { passive: true });

render();
cloudInit();
</script>
</body>
